<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IroiroWada</title>

<!-- PWA: manifest e icone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS non legge il manifest per queste impostazioni: vanno ripetute qui -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IroiroWada">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Iroiro<span id="wada">Wada</span></h1>
  <div class="header-actions">
    <button class="icon-btn" id="help-btn" aria-label="Rivedi il tutorial" title="Come funziona l'app">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.5-2.3 1.8-2.3 3.5"/>
        <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="icon-btn" id="star-btn" aria-label="Salva combinazione nei preferiti" title="Preferisci">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>
    <button class="icon-btn" id="fav-toggle" aria-label="Apri i preferiti" title="Preferiti">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v16l-9-5-9 5V5Z"/>
      </svg>
    </button>
  </div>
</header>

<div class="controls">
  <div class="field">
    <label for="hex-input">Colore (hex, RGB o nome)</label>
    <div class="color-picker">
      <input type="text" id="hex-input" placeholder="#a8391f, 168,57,31 o nome..." maxlength="40" autocomplete="off">
      <button id="swatch-toggle" aria-label="Sfoglia colori" title="Sfoglia colori">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <button id="eyedropper-btn" aria-label="Preleva colore dallo schermo" title="Preleva colore dallo schermo" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(45 12 11)">
    <rect x="9.5" y="1" width="5" height="12" rx="2"/>
    <path d="M9.5 13 12 21 14.5 13"/>
  </g>
<path d="M3.745 20.365
         C3.15 21.3 2.64 22.023 2.64 22.725
         A1.87 1.87 0 0 0 6.39 22.725
         C6.39 22.023 5.88 21.3 5.285 20.365
         L4.36 19.175
         Z"
      fill="currentColor"
      stroke="none"/></svg>
      </button>
      <button id="camera-btn" aria-label="Cattura colore con la fotocamera" title="Cattura colore con la fotocamera" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>
      <button id="simulate-toggle" aria-label="Apri anteprima simulata" title="Anteprima simulata" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 18v3"/>
        </svg>
      </button>
      <div id="swatch-dropdown"></div>
    </div>
  </div>

  <div class="field">
    <span class="field-label" id="count-label">Numero di colori</span>
    <div class="count-select" id="count-select" role="group" aria-labelledby="count-label">
      <button class="count-btn" data-count="2">2</button>
      <button class="count-btn" data-count="3">3</button>
      <button class="count-btn" data-count="4">4</button>
    </div>
  </div>
</div>

<main>
  <div id="empty-state">Scegli un colore per vedere le combinazioni di Sanzo Wada.</div>
  <div id="bands" style="display:none;"></div>
</main>

<section id="simulation-view" aria-label="Anteprima simulata" style="display:none;">
  <div class="sim-topbar">
    <div class="sim-actions">
      <button class="sim-btn" id="sim-contrast-btn" aria-pressed="false">Verifica contrasto AA (4.5:1)</button>
      <button class="sim-btn" id="sim-autofix-btn" aria-pressed="false">Applica contrasto minimo</button>
      <button class="sim-btn" id="sim-format-btn" aria-pressed="false">Formato: HEX</button>
      <button class="sim-btn" id="sim-next-btn" aria-label="Prossimo colore principale" title="Prossimo colore principale">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14.9-4L3 10"/>
          <path d="M3 5v5h5"/>
          <path d="M4 13a8 8 0 0 0 14.9 4L21 14"/>
          <path d="M21 19v-5h-5"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="sim-screen"></div>
</section>

<div id="overlay"></div>

<div id="camera-view" aria-label="Cattura colore dalla fotocamera" role="dialog" aria-modal="true" style="display:none;">
  <div class="camera-topbar">
    <span class="camera-hint">Tocca un punto per campionare il colore</span>
    <button class="icon-btn" id="camera-close" aria-label="Chiudi fotocamera">✕</button>
  </div>
  <div id="camera-stage">
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="camera-canvas" style="display:none;"></canvas>
    <div id="camera-error" style="display:none;"></div>
  </div>
</div>

<aside id="favorites-panel" aria-label="Preferiti">
  <div class="fav-header">
    <h2>Preferiti</h2>
    <button class="icon-btn" id="fav-close" aria-label="Chiudi preferiti">✕</button>
  </div>
  <div class="fav-tools">
    <input type="text" id="fav-search" placeholder="Cerca nei preferiti…" aria-label="Cerca nei preferiti">
    <div class="fav-sort" role="group" aria-label="Ordina preferiti">
      <button class="fav-sort-btn active" data-sort="recent">Recenti</button>
      <button class="fav-sort-btn" data-sort="alpha">A-Z</button>
      <button class="fav-sort-btn" data-sort="hue">Tonalità</button>
      <button class="fav-sort-btn" data-sort="count">N°</button>
    </div>
  </div>
  <div id="fav-list"></div>
</aside>

<div id="tutorial-overlay" style="display:none;">
  <div id="tutorial-card" role="dialog" aria-live="polite" aria-label="Tutorial IroiroWada"></div>
</div>

<script src="script.js"></script>
</body>
</html>
